<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資訊日樓層編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a drafting table. Top-down plan on the left where rooms are dragged and resized; properties, live 3D view and export on the right. */
:root{
  --ink:#1c1530;--muted:#655e7a;--page:#f4f2f8;--white:#fff;--line:#e2ddec;
  --purple:#33186f;--red:#d1242c;--c:#1f6fe0;--tint:#d4e5ff;
  --num:"Playfair Display",Georgia,serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
button,input,select{font:inherit}
.top{background:var(--purple);color:#fff}
.top .in{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.04em}
.top p{margin:0;font-size:13px;opacity:.8;flex:1;min-width:200px}
.tb{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:#fff;color:var(--purple)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1500px;margin:0 auto;padding:14px 18px 40px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-family:var(--num);font-weight:900;font-size:18px;color:var(--fc)}
.tab[aria-selected="true"]{background:var(--fc);border-color:var(--fc);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h2 .fl{font-family:var(--num);font-size:22px;color:var(--c)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.bar label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
#plan{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border-radius:10px}
#plan .rm{cursor:move}
#plan .rm.sel rect.body{stroke:var(--red);stroke-width:1.2}
#plan .hd{fill:#fff;stroke:var(--red);stroke-width:.8;cursor:nwse-resize}
#plan .hd.ne,#plan .hd.sw{cursor:nesw-resize}
#plan text{pointer-events:none;font-family:var(--body)}
.side{display:grid;gap:14px}
.props{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.props label{font-size:13px;color:var(--muted)}
.props input[type=text],.props select,.props input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nums input{padding:6px!important}
.empty{color:var(--muted);font-size:14px}
.exl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.exl li{display:flex;align-items:center;gap:8px;font-size:14px}
.exl b{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.exl .miss{margin-left:auto;font-size:12px;color:var(--red);font-weight:700}
.exl .ok{margin-left:auto;font-size:12px;color:#17a34a;font-weight:700}
#iso{display:block;width:100%;height:auto}
.help{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.help li{margin:2px 0}
.modal{position:fixed;inset:0;background:rgba(20,12,40,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:18px;width:min(100%,640px);display:grid;gap:10px}
.modal h3{margin:0}
.modal textarea{width:100%;height:260px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>資訊日樓層編輯器</h1>
  <p>拖動房間改位置，拉角落改大小。改好後按「複製版面資料」，貼給 Claude 即可更新網頁地圖。</p>
  <div class="tb">
    <button class="btn" id="copyBtn" type="button">複製版面資料</button>
    <button class="btn ghost" id="loadBtn" type="button">載入版面資料</button>
    <button class="btn ghost" id="undoBtn" type="button" disabled>↶ 復原</button>
    <button class="btn ghost" id="resetBtn" type="button">重設</button>
  </div>
</div></header>

<main class="wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="選擇樓層"></div>
  <div class="grid">
    <section class="card">
      <h2><span class="fl" id="flName">7F</span><span id="flTheme"></span></h2>
      <div class="bar">
        <button class="btn line sm" id="addBtn" type="button">＋ 新增房間</button>
        <label>從其他樓層複製格局 <select id="copyFrom"></select></label>
        <label><input type="checkbox" id="snap" checked> 吸附格線</label>
        <label>底圖 <input type="file" id="bgFile" accept="image/*"></label>
        <label>底圖透明度 <input type="range" id="bgOp" min="0" max="100" value="45"></label>
      </div>
      <svg id="plan" viewBox="-8 -14 256 178" aria-label="由上向下看的樓層平面圖"></svg>
      <ol class="help">
        <li>上邊是特別室大樓那一邊，下邊是課室一排（GF 正門那一邊）。</li>
        <li>點選房間後可以拖動，拉四個角改大小；鍵盤方向鍵可以微調（按住 Shift 每次移 5 格），Delete 刪除。</li>
        <li>可以上載該層平面圖照片做底圖，照着描。底圖只在你的瀏覽器顯示，不會儲存。</li>
      </ol>
    </section>

    <div class="side">
      <section class="card">
        <h2>選中的房間</h2>
        <div id="props"><p class="empty">在左邊點選一個房間。</p></div>
      </section>
      <section class="card">
        <h2>本層展區</h2>
        <ul class="exl" id="exList"></ul>
      </section>
      <section class="card">
        <h2>3D 效果</h2>
        <svg id="iso" viewBox="0 0 420 260" aria-label="本層 3D 效果"></svg>
      </section>
    </div>
  </div>
</main>

<div class="modal" id="modal"><div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h3 id="mTitle">版面資料</h3>
  <p id="mHint" class="empty"></p>
  <textarea id="mText" spellcheck="false"></textarea>
  <div class="tb"><button class="btn red" id="mOk" type="button">載入</button><button class="btn line" id="mCancel" type="button">關閉</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>

const W=DEFAULT.size.w,D=DEFAULT.size.d,KEY="qm-floorplan-v1";
const clone=o=>JSON.parse(JSON.stringify(o));
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data||!data.floors)data=clone(DEFAULT);
let fi=0,sel=-1,undo=[],bg={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const snapOn=()=>$("snap").checked;
const sn=v=>snapOn()?Math.round(v/2)*2:Math.round(v*10)/10;
function pushUndo(){undo.push(JSON.stringify(data));if(undo.length>60)undo.shift();$("undoBtn").disabled=false;}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}
const rooms=()=>data.floors[fi].rooms;
const F=()=>data.floors[fi].f;

/* ---------- tabs ---------- */
function renderTabs(){
  $("tabs").innerHTML=data.floors.map((fl,i)=>`<button type="button" class="tab" role="tab" id="tab-${i}" aria-selected="${i===fi}" style="--fc:${THEME[fl.f][1]}" data-i="${i}">${fl.f}</button>`).join("");
  $("copyFrom").innerHTML=`<option value="">選擇…</option>`+data.floors.map((fl,i)=>i===fi?"":`<option value="${i}">${fl.f}</option>`).join("");
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;fi=+b.dataset.i;sel=-1;renderAll();});

/* ---------- plan (top-down) ---------- */
const FILL={ex:null,room:"#f7f5fb",st:"url(#pst)",cor:"#efecf5",void:"#e9e6f0",solar:"url(#psol)"};
function renderPlan(){
  const [tn,c,tint]=THEME[F()];
  document.documentElement.style.setProperty("--c",c);document.documentElement.style.setProperty("--tint",tint);
  $("flName").textContent=F();$("flTheme").textContent=tn;
  let h=`<defs><pattern id="pst" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#e4e0ec"/><line x1="0" y1="0" x2="0" y2="3" stroke="#b9b2cc" stroke-width="1"/></pattern><pattern id="psol" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#3d4f7a"/><rect width="3.4" height="3.4" fill="#5b6f9e"/></pattern></defs>`;
  if(bg[fi])h+=`<image href="${bg[fi]}" x="0" y="0" width="${W}" height="${D}" preserveAspectRatio="none" opacity="${$("bgOp").value/100}"/>`;
  for(let x=0;x<=W;x+=10)h+=`<line x1="${x}" y1="0" x2="${x}" y2="${D}" stroke="${x%50?"#eeebf3":"#d9d4e4"}" stroke-width="${x%50?.3:.5}"/>`;
  for(let y=0;y<=D;y+=10)h+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${y%50?"#eeebf3":"#d9d4e4"}" stroke-width="${y%50?.3:.5}"/>`;
  h+=`<rect x="0" y="0" width="${W}" height="${D}" fill="none" stroke="#33186f" stroke-width=".8"/>`;
  h+=`<text x="${W/2}" y="-6" text-anchor="middle" font-size="5" fill="#655e7a">↑ 特別室大樓那一邊</text><text x="${W/2}" y="${D+9}" text-anchor="middle" font-size="5" fill="#655e7a">↓ 課室一排（GF 正門那一邊）</text>`;
  const order=rooms().map((r,i)=>i).sort((a,b)=>(rooms()[a].k==="cor")-(rooms()[b].k==="cor")).reverse();
  order.forEach(i=>{const r=rooms()[i],on=r.k==="ex";
    const fill=on?c:FILL[r.k]||"#f7f5fb";
    h+=`<g class="rm${i===sel?" sel":""}" data-r="${i}"><rect class="body" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${fill}" fill-opacity="${on?.8:1}" stroke="${on?c:"#b9b2cc"}" stroke-width=".5"/>`;
    const fs=Math.max(2.6,Math.min(4.2,r.w/(r.n.length*0.9+1)*1.6,r.h/3));
    const words=(r.n||"").split(" ");
    words.forEach((w,j)=>{h+=`<text x="${r.x+r.w/2}" y="${r.y+r.h/2+(j-(words.length-1)/2)*fs*1.15+fs*.35}" text-anchor="middle" font-size="${fs}" fill="${on?"#fff":"#4a4460"}" font-weight="${on?700:400}">${esc(w)}</text>`;});
    if(on&&r.e!=null)h+=`<circle cx="${r.x+4}" cy="${r.y+4}" r="3.2" fill="#fff"/><text x="${r.x+4}" y="${r.y+5.4}" text-anchor="middle" font-size="4" font-weight="900" fill="${c}">${r.e+1}</text>`;
    h+=`</g>`;});
  if(sel>=0){const r=rooms()[sel];[["nw",r.x,r.y],["ne",r.x+r.w,r.y],["sw",r.x,r.y+r.h],["se",r.x+r.w,r.y+r.h]].forEach(([k,x,y])=>{h+=`<rect class="hd ${k}" data-h="${k}" x="${x-2.2}" y="${y-2.2}" width="4.4" height="4.4" rx="1"/>`;});}
  $("plan").innerHTML=h;
}

/* drag & resize */
let drag=null;
function toPlan(e){const svg=$("plan"),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
$("plan").addEventListener("pointerdown",e=>{
  const hd=e.target.closest("[data-h]"),g=e.target.closest("[data-r]");const p=toPlan(e);
  if(hd&&sel>=0){pushUndo();drag={mode:hd.dataset.h,p0:p,r0:{...rooms()[sel]}};}
  else if(g){sel=+g.dataset.r;pushUndo();drag={mode:"move",p0:p,r0:{...rooms()[sel]}};renderAll();}
  else{sel=-1;renderAll();return;}
  $("plan").setPointerCapture(e.pointerId);e.preventDefault();
});
$("plan").addEventListener("pointermove",e=>{
  if(!drag||sel<0)return;const p=toPlan(e),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y,r=rooms()[sel],o=drag.r0;
  if(drag.mode==="move"){r.x=sn(Math.min(Math.max(o.x+dx,-20),W+20-o.w));r.y=sn(Math.min(Math.max(o.y+dy,-20),D+20-o.h));}
  else{let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;
    if(drag.mode.includes("w"))x0=sn(o.x+dx);if(drag.mode.includes("e"))x1=sn(o.x+o.w+dx);
    if(drag.mode.includes("n"))y0=sn(o.y+dy);if(drag.mode.includes("s"))y1=sn(o.y+o.h+dy);
    if(x1-x0<4){if(drag.mode.includes("w"))x0=x1-4;else x1=x0+4;}if(y1-y0<4){if(drag.mode.includes("n"))y0=y1-4;else y1=y0+4;}
    r.x=x0;r.y=y0;r.w=Math.round((x1-x0)*10)/10;r.h=Math.round((y1-y0)*10)/10;}
  renderPlan();renderIso();renderPropsNums();
});
const endDrag=()=>{if(drag){drag=null;save();renderAll();}};
$("plan").addEventListener("pointerup",endDrag);$("plan").addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",e=>{
  if(sel<0||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  const r=rooms()[sel],st=e.shiftKey?5:1;let used=true;
  if(e.key==="ArrowLeft"){pushUndo();r.x-=st;}else if(e.key==="ArrowRight"){pushUndo();r.x+=st;}
  else if(e.key==="ArrowUp"){pushUndo();r.y-=st;}else if(e.key==="ArrowDown"){pushUndo();r.y+=st;}
  else if(e.key==="Delete"||e.key==="Backspace"){pushUndo();rooms().splice(sel,1);sel=-1;}
  else used=false;
  if(used){e.preventDefault();save();renderAll();}
});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();doUndo();}});

/* ---------- properties ---------- */
function renderProps(){
  const box=$("props");
  if(sel<0){box.innerHTML=`<p class="empty">在左邊點選一個房間。</p>`;return;}
  const r=rooms()[sel],ex=EX[F()];
  box.innerHTML=`<div class="props">
    <label for="pName">名稱</label><input type="text" id="pName" value="${esc(r.n||"")}">
    <label for="pKind">類型</label><select id="pKind">${KINDS.map(([k,n])=>`<option value="${k}"${k===r.k?" selected":""}>${n}</option>`).join("")}</select>
    <label for="pEx">對應展區</label><select id="pEx"${r.k!=="ex"?" disabled":""}><option value="">（未指定）</option>${ex.map((n,i)=>`<option value="${i}"${r.e===i?" selected":""}>${i+1}. ${esc(n)}</option>`).join("")}</select>
    <label>位置／大小</label><div class="nums"><input type="number" id="pX" aria-label="左邊位置 X" step="1"><input type="number" id="pY" aria-label="上邊位置 Y" step="1"><input type="number" id="pW" aria-label="闊度" step="1" min="4"><input type="number" id="pH" aria-label="深度" step="1" min="4"></div>
    <span></span><div class="tb"><button class="btn line sm" id="dupBtn" type="button">複製此房間</button><button class="btn line sm" id="delBtn" type="button" style="color:var(--red)">刪除</button></div>
  </div>`;
  renderPropsNums();
  $("pName").addEventListener("focus",pushUndo,{once:true});
  $("pName").addEventListener("input",e=>{r.n=e.target.value;save();renderPlan();renderIso();});
  $("pKind").addEventListener("change",e=>{pushUndo();r.k=e.target.value;if(r.k!=="ex")delete r.e;save();renderAll();});
  $("pEx").addEventListener("change",e=>{pushUndo();if(e.target.value==="")delete r.e;else r.e=+e.target.value;save();renderAll();});
  [["pX","x"],["pY","y"],["pW","w"],["pH","h"]].forEach(([id,k])=>{$(id).addEventListener("change",e=>{pushUndo();r[k]=Math.max(k==="w"||k==="h"?4:-50,+e.target.value||0);save();renderPlan();renderIso();});});
  $("dupBtn").addEventListener("click",()=>{pushUndo();const n={...r,x:r.x+6,y:r.y+6};rooms().push(n);sel=rooms().length-1;save();renderAll();});
  $("delBtn").addEventListener("click",()=>{pushUndo();rooms().splice(sel,1);sel=-1;save();renderAll();});
}
function renderPropsNums(){if(sel<0||!$("pX"))return;const r=rooms()[sel];$("pX").value=r.x;$("pY").value=r.y;$("pW").value=r.w;$("pH").value=r.h;}

/* ---------- exhibit checklist ---------- */
function renderEx(){
  const placed=new Set(rooms().filter(r=>r.k==="ex"&&r.e!=null).map(r=>r.e));
  $("exList").innerHTML=EX[F()].map((n,i)=>`<li><b>${i+1}</b>${esc(n)}${placed.has(i)?'<span class="ok">已放</span>':'<span class="miss">未放</span>'}</li>`).join("");
}

/* ---------- 3D preview of this floor ---------- */
function renderIso(){
  const [tn,c,tint]=THEME[F()],C=.866,S=.5,k=1.02,cx=165,cy=28,TH=9;
  const P=(x,y)=>[cx+(x-y)*C*k,cy+(x+y)*S*k],pts=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
  const q=(x0,x1,y0,y1)=>pts([P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)]);
  const a=P(0,0),b=P(W,0),cc=P(W,D),d=P(0,D),dn=p=>[p[0],p[1]+TH];
  let h=`<defs><pattern id="ist" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#e4e0ec"/><line x1="0" y1="0" x2="0" y2="5" stroke="#b9b2cc" stroke-width="1.6"/></pattern><pattern id="isol" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#3d4f7a"/><rect width="5" height="5" fill="#5b6f9e"/></pattern></defs>`;
  h+=`<polygon points="${pts([d,cc,dn(cc),dn(d)])}" fill="${c}" opacity=".85"/><polygon points="${pts([cc,b,dn(b),dn(cc)])}" fill="${c}" opacity=".65"/><polygon points="${pts([a,b,cc,d])}" fill="#fff" stroke="${c}" stroke-width="2"/>`;
  const IF={room:"#f7f5fb",st:"url(#ist)",cor:"#efecf5",void:"#ece9f2",solar:"url(#isol)"};
  const pins=[],seen={};
  ["cor","void","room","st","solar","ex"].forEach(kd=>rooms().forEach(r=>{if(r.k!==kd)return;const on=r.k==="ex";
    h+=`<polygon points="${q(r.x,r.x+r.w,r.y,r.y+r.h)}" fill="${on?c:IF[r.k]||"#f7f5fb"}" fill-opacity="${on?.88:1}" stroke="${on?c:r.k==="cor"?"none":"#d6d0e3"}" stroke-width="1"/>`;
    if(on&&r.e!=null&&!seen[r.e]){seen[r.e]=1;pins.push([r.e,r.x+r.w/2,r.y+r.h/2]);}}));
  pins.sort((p,q2)=>(p[1]-p[2])-(q2[1]-q2[2])).forEach((pn,j)=>{const p=P(pn[1],pn[2]),st=j%2?30:14;
    h+=`<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${p[1]-st}" stroke="#1c1530" stroke-width="1.6"/><circle cx="${p[0]}" cy="${p[1]-st-11}" r="11" fill="#fff" stroke="${c}" stroke-width="2.4"/><text x="${p[0]}" y="${p[1]-st-6.5}" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-weight="900" font-size="13" fill="${c}">${pn[0]+1}</text>`;});
  $("iso").innerHTML=h;
}

function renderAll(){renderTabs();renderPlan();renderProps();renderEx();renderIso();}

/* ---------- toolbar ---------- */
$("addBtn").addEventListener("click",()=>{pushUndo();rooms().push({n:"新房間",x:W/2-15,y:D/2-10,w:30,h:20,k:"room"});sel=rooms().length-1;save();renderAll();});
$("copyFrom").addEventListener("change",e=>{if(e.target.value==="")return;const src=data.floors[+e.target.value];
  pushUndo();data.floors[fi].rooms=clone(src.rooms).map(r=>{if(r.k==="ex"){r.k="room";delete r.e;}return r;});sel=-1;save();renderAll();toast(`已複製 ${src.f} 的格局（展區要重新指定）`);});
function doUndo(){if(!undo.length)return;data=JSON.parse(undo.pop());sel=-1;save();renderAll();$("undoBtn").disabled=!undo.length;}
$("undoBtn").addEventListener("click",doUndo);
$("resetBtn").addEventListener("click",()=>{openModal("重設為原始版面？","這會清除你所有修改。確定的話按「重設」。","",true);});
$("bgFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{bg[fi]=rd.result;renderPlan();};rd.readAsDataURL(f);e.target.value="";});
$("bgOp").addEventListener("input",renderPlan);
$("snap").addEventListener("change",()=>{});

/* export / import */
const out=()=>JSON.stringify(data,null,1);
$("copyBtn").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(out());toast("已複製！貼給 Claude 即可");}
  catch(e){openModal("版面資料","自動複製不成功，請全選下面的文字再複製。",out(),false,true);}
});
$("loadBtn").addEventListener("click",()=>openModal("載入版面資料","把之前複製的版面資料貼在下面，再按「載入」。","",false));
let modalMode="load";
function openModal(title,hint,text,isReset,readOnly){
  modalMode=isReset?"reset":readOnly?"show":"load";
  $("mTitle").textContent=title;$("mHint").textContent=hint;$("mText").value=text;
  $("mText").style.display=isReset?"none":"block";$("mText").readOnly=!!readOnly;
  $("mOk").textContent=isReset?"重設":"載入";$("mOk").style.display=readOnly?"none":"inline-block";
  $("modal").classList.add("open");(readOnly||!isReset?$("mText"):$("mOk")).focus();if(readOnly)$("mText").select();
}
const closeModal=()=>$("modal").classList.remove("open");
$("mCancel").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
$("mOk").addEventListener("click",()=>{
  if(modalMode==="reset"){pushUndo();data=clone(DEFAULT);sel=-1;save();renderAll();closeModal();toast("已重設");return;}
  try{const d=JSON.parse($("mText").value);if(!d.floors||!Array.isArray(d.floors))throw 0;pushUndo();data=d;fi=0;sel=-1;save();renderAll();closeModal();toast("已載入");}
  catch(e){$("mHint").textContent="資料格式不正確：請貼上由「複製版面資料」得到的完整內容。";}
});

renderAll();
</script>
</body>
</html>
